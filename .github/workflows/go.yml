name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.27.x]
    steps:
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      # Catches go.mod/go.sum drift, a dependency that starts requiring a newer
      # Go among it. What it cannot catch is this repository's own code reaching
      # for a newer standard library; the job below is what covers that.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Test
        run: make test

  minimum:
    name: Go ${{ matrix.go-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26.x]
    steps:
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      # The go directive is a promise to consumers, and building it is the only
      # thing that keeps the promise honest. GOTOOLCHAIN=local holds the build
      # to the Go installed above - the toolchain directive would otherwise
      # fetch a newer one and the job would prove nothing. The linter belongs to
      # the job above; what this one exercises is the compiler and the library.
      - name: Test on the lowest supported Go
        env:
          GOTOOLCHAIN: local
        run: go test -race -tags kqueue ./...
