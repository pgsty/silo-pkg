name: LDAP Config Validator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run for the same pull request or branch. github.head_ref
# is only set on pull_request events, so keying on it alone put every push and
# manual run in one group, where they cancelled each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ldap-config-validator:
    name: Test LDAP configuration validator (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    services:
      openldap:
        image: quay.io/minio/openldap
        ports:
          - "389:389"
          - "636:636"
        env:
          LDAP_ORGANIZATION: "MinIO Inc"
          LDAP_DOMAIN: "min.io"
          LDAP_ADMIN_PASSWORD: "admin"
    strategy:
      matrix:
        go-version: [1.27.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false # handled by the explicit cache step below
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.go-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.go-version }}-go-
      - name: Test with LDAP server
        env:
          LDAP_TEST_SERVER: "localhost:389"
        run: make test-ldap
